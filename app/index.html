<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>showy</title>
  <meta name="description" content="TCGplayer market, lowest listed and last sold for e-Reader era, WotC promo and Japanese vending and VS cards, saved for offline use at card shows.">
  <meta name="theme-color" content="#1E1720">
  <script>(function(){var r=document.documentElement;try{var t=JSON.parse(localStorage.getItem("eq:theme"));if(t)r.dataset.theme=t;var c=JSON.parse(localStorage.getItem("eq:cond"));r.dataset.cond=c||"NM"}catch(e){r.dataset.cond="NM"}r.classList.add(matchMedia("(prefers-reduced-motion: reduce)").matches?"no-intro":"intro-on")})()</script>
  <meta name="apple-mobile-web-app-title" content="showy">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/atkinson-hyperlegible-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/baloo-2-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="sg-defs" width="0" height="0" aria-hidden="true" focusable="false"><defs><pattern id="sg-stripe" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="4" height="8" fill="#D24552"/><rect x="4" width="4" height="8" fill="#F8EADA"/></pattern><pattern id="sg-dots" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#D24552"/><circle cx="4.5" cy="4.5" r="1.7" fill="#F8EADA"/></pattern><pattern id="sg-net" width="4.6" height="4.6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V4.6 M0 0 H4.6" stroke="#2B2236" stroke-width=".85" fill="none"/></pattern></defs></svg>
  <div id="intro" class="intro" aria-hidden="true">
    <div class="intro-stage">
      <span class="icard" style="--c:#E58C7A;--x:-50px;--y:12px;--r:-17deg;--d:.04s"></span>
      <span class="icard" style="--c:#7FA6C9;--x:50px;--y:12px;--r:17deg;--d:.11s"></span>
      <span class="icard" style="--c:#EDBE5A;--x:0px;--y:-6px;--r:0deg;--d:.18s"><i class="ishine"></i></span>
      <i class="istar"></i>
    </div>
    <div class="intro-word"><span style="--i:0">s</span><span style="--i:1">h</span><span style="--i:2">o</span><span style="--i:3">w</span><span style="--i:4">y</span></div>
  </div>
  <header class="top">
    <div class="titlebar">
      <h1>showy</h1>
      <div class="top-actions">
        <button id="hagl" class="hagl-btn" type="button" aria-label="hagl: haggle tools"><span class="emoji" aria-hidden="true">🤝</span>hagl<span class="hagl-n" id="hagl-n" hidden></span></button>
        <button id="collection" class="icon-btn" type="button" aria-label="Your collection">
          <span class="emoji" aria-hidden="true">📚</span>
        </button>
        <button id="theme" class="icon-btn" type="button" aria-label="Switch to light mode"></button>
        <button id="refresh" class="icon-btn" type="button" aria-label="Refresh prices">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <p id="status" class="status" role="status">Loading saved prices…</p>
    <div class="buddy-row">
      <button class="buddy" id="buddy" type="button" data-mood="idle" aria-label="Poke the magician"></button>
      <p id="bubble" class="bubble" aria-live="polite"></p>
    </div>
  </header>

  <div class="finder">
    <label class="search">
      <span class="visually-hidden">Search cards</span>
      <span class="emoji" aria-hidden="true">🔍</span>
      <input id="q" type="search" placeholder="Name or number" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    </label>
    <div class="sets" id="sets" role="group" aria-label="Set"></div>
  </div>

  <div class="listhead">
    <p id="count" class="count"></p>
    <button id="sort" class="sort" type="button"></button>
  </div>
  <div id="nudge"></div>
  <main id="list" class="list" aria-live="polite"></main>

  <nav class="dock" aria-label="Condition">
    <div class="seg" id="condition" role="group" aria-label="Condition"></div>
  </nav>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
  <input id="csv" type="file" accept=".csv,text/csv,text/comma-separated-values,application/vnd.ms-excel" hidden>

  <script src="app.js"></script>
</body>
</html>
